name: Node.js CI

on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main
    workflow_dispatch:

permissions:
    contents: read
    packages: write

  jobs:
    test:
      name: Testleri çalıştır
      runs-on: ubuntu-latest
      timeout-minutes: 10

      steps:
        - name: Repository kodunu indir
          uses: actions/checkout@v7

        - name: Node.js ortamını hazırla
          uses: actions/setup-node@v7
          with:
            node-version: "22"
            cache: npm

        - name: Bağımlılıkları yükle
          run: npm ci

        - name: Testleri çalıştır
          run: npm test

    docker-publish:
      name: Docker image yayımla
      runs-on: ubuntu-latest
      timeout-minutes: 15
      needs: test
      if: github.event_name == 'push'

      steps:
        - name: Repository kodunu indir
          uses: actions/checkout@v7

        - name: GitHub Container Registry'ye giriş yap
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Docker image oluştur ve gönder
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: |
              ghcr.io/edaaslanboga/node-cicd-project:latest
              ghcr.io/edaaslanboga/node-cicd-project:${{ github.sha }}

